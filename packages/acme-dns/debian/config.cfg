# Safe package default; configure production separately before enabling.
[general]
listen = "127.0.0.1:5354"
protocol = "both4"
domain = "acme.invalid"
nsname = "ns.acme.invalid"
nsadmin = "hostmaster.acme.invalid"
records = ["acme.invalid. 60 IN NS ns.acme.invalid."]
debug = false

[database]
engine = "sqlite"
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
ip = "127.0.0.1"
port = "8080"
disable_registration = true
tls = "none"
acme_cache_dir = "/var/lib/acme-dns/api-certs"
corsorigins = []
use_header = false

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "json"
